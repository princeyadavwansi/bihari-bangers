<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bihari Bangers | Bhojpuri Music</title>

<meta name="description"
content="Bihari Bangers - Bhojpuri music, desi beats and nonstop Bhojpuri songs.">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    color:white;
    overflow:hidden;

    background:
        linear-gradient(
            rgba(35,22,12,.40),
            rgba(20,12,7,.72)
        ),
        url("background.jpg");

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
}

/* ================= TOP BAR ================= */

.top{
    position:fixed;
    top:22px;
    left:28px;
    right:28px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    z-index:50;
}

.clock{
    font-size:18px;
    font-weight:600;
    text-shadow:0 2px 10px black;
}

.top-right{
    display:flex;
    align-items:center;
    gap:10px;
}

.glass-btn{
    border:1px solid rgba(255,255,255,.22);
    background:rgba(80,60,40,.38);

    color:white;

    padding:11px 18px;
    border-radius:30px;

    backdrop-filter:blur(15px);
    -webkit-backdrop-filter:blur(15px);

    cursor:pointer;

    transition:.25s;
}

.glass-btn:hover{
    background:rgba(255,255,255,.22);
    transform:translateY(-2px);
}

/* ================= MAIN ================= */

.main{
    width:100%;
    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    text-align:center;

    padding-bottom:70px;
}

.center{
    display:flex;
    flex-direction:column;
    align-items:center;
}

/* ONLINE */

.online{
    padding:8px 17px;

    border:1px solid rgba(255,255,255,.25);

    background:rgba(60,45,30,.38);

    backdrop-filter:blur(12px);

    border-radius:30px;

    font-size:14px;

    margin-bottom:25px;
}

.dot{
    width:9px;
    height:9px;

    display:inline-block;

    background:#65df73;

    border-radius:50%;

    margin-right:7px;

    box-shadow:0 0 10px #65df73;
}

/* TITLE */

.title{
    font-family:Georgia,"Times New Roman",serif;

    font-size:clamp(60px,9vw,125px);

    line-height:.9;

    font-weight:500;

    text-shadow:
        0 5px 20px rgba(0,0,0,.75),
        0 2px 5px black;

    letter-spacing:-4px;
}

.title span{
    font-family:Georgia,"Times New Roman",serif;
}

.subtitle{
    margin-top:28px;

    font-size:14px;

    letter-spacing:5px;

    opacity:.9;

    text-shadow:0 2px 8px black;
}

/* NOTICE */

.notice{
    margin-top:35px;

    padding:14px 25px;

    border-radius:17px;

    background:rgba(90,45,25,.45);

    border:1px solid rgba(255,255,255,.22);

    backdrop-filter:blur(15px);

    font-size:14px;

    box-shadow:0 10px 30px rgba(0,0,0,.2);
}

.notice b{
    display:block;
    margin-bottom:5px;
}

/* ================= SONG PANEL ================= */

.song-panel{
    position:fixed;

    right:25px;
    top:100px;

    width:280px;

    background:rgba(25,20,15,.65);

    border:1px solid rgba(255,255,255,.2);

    backdrop-filter:blur(20px);

    border-radius:20px;

    padding:18px;

    z-index:100;

    display:none;

    box-shadow:0 20px 60px rgba(0,0,0,.4);
}

.song-panel.active{
    display:block;
}

.song-panel h3{
    margin-bottom:12px;
}

.search{
    width:100%;

    padding:11px 13px;

    border:none;
    outline:none;

    border-radius:12px;

    background:rgba(255,255,255,.12);

    color:white;

    margin-bottom:10px;
}

.search::placeholder{
    color:rgba(255,255,255,.65);
}

.song-item{
    padding:11px;

    border-radius:10px;

    cursor:pointer;

    transition:.2s;
}

.song-item:hover{
    background:rgba(255,255,255,.14);
}

/* ================= PLAYER ================= */

.player{
    position:fixed;

    left:50%;
    bottom:25px;

    transform:translateX(-50%);

    width:min(650px,calc(100% - 30px));

    min-height:82px;

    padding:12px 18px;

    display:flex;

    align-items:center;

    gap:14px;

    border-radius:28px;

    background:rgba(35,30,25,.62);

    border:1px solid rgba(255,255,255,.27);

    backdrop-filter:blur(22px);

    -webkit-backdrop-filter:blur(22px);

    box-shadow:
        0 15px 50px rgba(0,0,0,.45);

    z-index:80;
}

/* COVER */

.cover{
    width:58px;
    height:58px;

    border-radius:50%;

    object-fit:cover;

    background:#333;

    border:1px solid rgba(255,255,255,.4);

    flex-shrink:0;
}

/* SONG INFO */

.info{
    flex:1;

    min-width:0;

    text-align:left;
}

.song-title{
    font-size:15px;

    font-weight:bold;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.artist{
    margin-top:5px;

    font-size:12px;

    opacity:.65;
}

/* CONTROLS */

.controls{
    display:flex;

    align-items:center;

    gap:9px;
}

.control{
    width:40px;
    height:40px;

    border:none;

    border-radius:50%;

    background:rgba(255,255,255,.14);

    color:white;

    cursor:pointer;

    font-size:16px;

    transition:.2s;
}

.control:hover{
    background:rgba(255,255,255,.3);
}

.play{
    width:48px;
    height:48px;

    background:white;

    color:#222;

    font-size:18px;
}

.play:hover{
    background:#eee;
}

/* PROGRESS */

.progress-wrap{
    position:absolute;

    left:20px;
    right:20px;

    bottom:7px;
}

.progress{
    width:100%;

    height:3px;

    appearance:none;

    background:rgba(255,255,255,.25);

    border-radius:10px;

    cursor:pointer;
}

.progress::-webkit-slider-thumb{
    appearance:none;

    width:9px;
    height:9px;

    border-radius:50%;

    background:white;
}

/* ================= VOLUME ================= */

.volume-box{
    position:fixed;

    right:25px;
    bottom:120px;

    background:rgba(20,20,20,.65);

    backdrop-filter:blur(15px);

    padding:12px 15px;

    border-radius:15px;

    display:none;

    z-index:100;
}

.volume-box.active{
    display:block;
}

.volume{
    width:110px;
}

/* ================= MOBILE ================= */

@media(max-width:700px){

    .top{
        top:15px;
        left:15px;
        right:15px;
    }

    .clock{
        font-size:15px;
    }

    .glass-btn{
        padding:9px 12px;
        font-size:12px;
    }

    .title{
        font-size:60px;
        letter-spacing:-3px;
    }

    .subtitle{
        font-size:10px;
        letter-spacing:3px;
    }

    .notice{
        font-size:12px;

        margin-left:20px;
        margin-right:20px;
    }

    .player{
        bottom:15px;

        padding:10px 13px;

        border-radius:22px;
    }

    .cover{
        width:48px;
        height:48px;
    }

    .control{
        width:35px;
        height:35px;
    }

    .play{
        width:43px;
        height:43px;
    }

    .controls .control:first-child{
        display:none;
    }

    .song-panel{
        left:15px;
        right:15px;

        top:80px;

        width:auto;
    }
}
</style>
</head>

<body>

<!-- TOP -->

<header class="top">

    <div class="clock" id="clock">
        10:37 AM
    </div>

    <div class="top-right">

        <button
            class="glass-btn"
            onclick="toggleVolume()">
            🔊
        </button>

        <button
            class="glass-btn"
            onclick="toggleSongs()">
            🎵 Songs
        </button>

        <button
            class="glass-btn"
            onclick="support()">
            ❤️ Support
        </button>

    </div>

</header>


<!-- MAIN -->

<main class="main">

    <div class="center">

        <div class="online">
            <span class="dot"></span>
            <span id="online">892</span>
            people online
        </div>

        <h1 class="title">
            भोजपुरी<br>
            <span>Bangers</span>
        </h1>

        <p class="subtitle">
            DESI VIBES • BHOJPURI MUSIC • NONSTOP
        </p>

        <div class="notice">

            <b>🎧 Welcome to Bihari Bangers</b>

            Sirf Bhojpuri music ka asli adda ❤️

        </div>

    </div>

</main>


<!-- SONG LIST -->

<div
    class="song-panel"
    id="songPanel">

    <h3>🎵 Bhojpuri Songs</h3>

    <input
        class="search"
        id="search"
        placeholder="Search song..."
        oninput="searchSongs()">

    <div id="songList"></div>

</div>


<!-- VOLUME -->

<div
    class="volume-box"
    id="volumeBox">

    🔊

    <input
        class="volume"
        id="volume"
        type="range"
        min="0"
        max="1"
        step="0.01"
        value="1"
        oninput="changeVolume()">

</div>


<!-- PLAYER -->

<div class="player">

    <img
        id="cover"
        class="cover"
        src="cover.jpg"
        alt="Song cover">

    <div class="info">

        <div
            class="song-title"
            id="songTitle">
            Yadav Ji Ke Khatal Me
        </div>

        <div
            class="artist"
            id="artist">
            Saurav Yadav Official
        </div>

    </div>


    <div class="controls">

        <button
            class="control"
            onclick="previousSong()">
            ⏮
        </button>

        <button
            class="control play"
            id="playButton"
            onclick="playPause()">
            ▶
        </button>

        <button
            class="control"
            onclick="nextSong()">
            ⏭
        </button>

    </div>


    <div class="progress-wrap">

        <input
            class="progress"
            id="progress"
            type="range"
            min="0"
            max="100"
            value="0"
            onchange="seekSong()">

    </div>

</div>


<!-- AUDIO -->

<audio id="audio"></audio>


<script>

/* ================= SONG DATA ================= */

const songs = [

    {
        name:"Yadav Ji Ke Khatal Me",
        artist:"Saurav Yadav Official",
        file:"songs/song1.mp3",
        cover:"cover.jpg"
    },

    {
        name:"Bhojpuri Banger 2",
        artist:"Bhojpuri Artist",
        file:"songs/song2.mp3",
        cover:"cover2.jpg"
    },

    {
        name:"Desi Bhojpuri Beat",
        artist:"Bhojpuri Artist",
        file:"songs/song3.mp3",
        cover:"cover3.jpg"
    },

    {
        name:"Bhojpuri Party Mix",
        artist:"Bhojpuri Artist",
        file:"songs/song4.mp3",
        cover:"cover4.jpg"
    }

];


/* ================= VARIABLES ================= */

let currentSong = 0;

const audio =
    document.getElementById("audio");

const playButton =
    document.getElementById("playButton");

const progress =
    document.getElementById("progress");

const songList =
    document.getElementById("songList");


/* ================= LOAD SONG ================= */

function loadSong(index){

    currentSong = index;

    const song = songs[index];

    audio.src = song.file;

    document.getElementById("songTitle").innerText =
        song.name;

    document.getElementById("artist").innerText =
        song.artist;

    document.getElementById("cover").src =
        song.cover;
}


/* ================= PLAY ================= */

function playPause(){

    if(audio.paused){

        audio.play();

        playButton.innerHTML = "⏸";

    }else{

        audio.pause();

        playButton.innerHTML = "▶";

    }
}


/* ================= NEXT ================= */

function nextSong(){

    currentSong++;

    if(currentSong >= songs.length){
        currentSong = 0;
    }

    loadSong(currentSong);

    audio.play();

    playButton.innerHTML = "⏸";
}


/* ================= PREVIOUS ================= */

function previousSong(){

    currentSong--;

    if(currentSong < 0){
        currentSong = songs.length - 1;
    }

    loadSong(currentSong);

    audio.play();

    playButton.innerHTML = "⏸";
}


/* ================= AUTO NEXT ================= */

audio.addEventListener(
    "ended",
    nextSong
);


/* ================= PROGRESS ================= */

audio.addEventListener(
    "timeupdate",
    function(){

        if(audio.duration){

            progress.value =
                (audio.currentTime /
                audio.duration) * 100;

        }

    }
);


/* ================= SEEK ================= */

function seekSong(){

    if(audio.duration){

        audio.currentTime =
            (progress.value / 100)
            * audio.duration;

    }

}


/* ================= VOLUME ================= */

function toggleVolume(){

    document
        .getElementById("volumeBox")
        .classList.toggle("active");

}

function changeVolume(){

    audio.volume =
        document.getElementById("volume").value;

}


/* ================= SONG MENU ================= */

function toggleSongs(){

    document
        .getElementById("songPanel")
        .classList.toggle("active");

}


/* ================= SONG LIST ================= */

function renderSongs(list = songs){

    songList.innerHTML = "";

    list.forEach(
        (song,index)=>{

            const item =
                document.createElement("div");

            item.className = "song-item";

            item.innerHTML =
                "▶️ " + song.name;

            item.onclick =
                function(){

                    loadSong(index);

                    audio.play();

                    playButton.innerHTML = "⏸";

                };

            songList.appendChild(item);

        }
    );

}


/* ================= SEARCH ================= */

function searchSongs(){

    const text =
        document
        .getElementById("search")
        .value
        .toLowerCase();

    const filtered =
        songs.filter(
            song =>
            song.name
            .toLowerCase()
            .includes(text)
        );

    renderSongs(filtered);

}


/* ================= SUPPORT ================= */

function support(){

    alert(
        "❤️ Thank you for supporting Bihari Bangers!"
    );

}


/* ================= CLOCK ================= */

function updateClock(){

    const now =
        new Date();

    document
        .getElementById("clock")
        .innerText =
        now.toLocaleTimeString(
            [],
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );

}

setInterval(
    updateClock,
    1000
);

updateClock();


/* ================= ONLINE ================= */

setInterval(
    function(){

        const number =
            850 +
            Math.floor(
                Math.random() * 100
            );

        document
            .getElementById("online")
            .innerText =
            number;

    },
    5000
);


/* ================= START ================= */

loadSong(0);

renderSongs();

</script>

</body>
</html>
