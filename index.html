<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bihari Bangers — Bhojpuri Music</title>

<meta name="description"
content="Bihari Bangers - Bhojpuri music aur desi vibes ka adda.">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    color:#fff;
    background:#140d09;
    overflow-x:hidden;
}

/* ================= BACKGROUND ================= */

.background{
    position:fixed;
    inset:0;
    z-index:-5;

    background:
        radial-gradient(
            circle at 20% 25%,
            rgba(255,150,70,.45),
            transparent 30%
        ),
        radial-gradient(
            circle at 80% 20%,
            rgba(210,60,30,.35),
            transparent 35%
        ),
        radial-gradient(
            circle at 50% 90%,
            rgba(150,40,20,.30),
            transparent 40%
        ),
        linear-gradient(
            125deg,
            #21120c 0%,
            #5b2b17 35%,
            #25110d 65%,
            #090707 100%
        );
}

/* soft light */

.background::before{
    content:"";
    position:absolute;
    width:600px;
    height:600px;

    left:-200px;
    top:100px;

    background:rgba(255,174,90,.13);

    filter:blur(100px);
    border-radius:50%;
}

/* dark overlay */

.background::after{
    content:"";
    position:absolute;
    inset:0;

    background:
        linear-gradient(
            rgba(0,0,0,.18),
            rgba(0,0,0,.55)
        );
}

/* ================= TOP ================= */

.topbar{
    position:fixed;

    top:22px;
    left:28px;
    right:28px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    z-index:50;
}

.time{
    font-size:18px;
    font-weight:600;

    text-shadow:
        0 2px 15px #000;
}

.top-actions{
    display:flex;
    gap:10px;
}

.glass-button{
    border:1px solid rgba(255,255,255,.18);

    background:rgba(255,255,255,.10);

    color:#fff;

    padding:11px 18px;

    border-radius:30px;

    backdrop-filter:blur(18px);

    cursor:pointer;

    transition:.25s;
}

.glass-button:hover{
    background:rgba(255,255,255,.22);

    transform:translateY(-2px);
}

/* ================= HERO ================= */

.hero{
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    text-align:center;

    padding:90px 20px 180px;
}

.hero-content{
    display:flex;
    flex-direction:column;
    align-items:center;
}

/* ONLINE */

.online{
    padding:9px 18px;

    border-radius:30px;

    background:rgba(255,255,255,.10);

    border:1px solid rgba(255,255,255,.16);

    backdrop-filter:blur(15px);

    font-size:14px;

    margin-bottom:28px;
}

.online-dot{
    display:inline-block;

    width:9px;
    height:9px;

    border-radius:50%;

    background:#65e878;

    margin-right:7px;

    box-shadow:
        0 0 12px #65e878;
}

/* TITLE */

.title{
    font-family:Georgia,"Times New Roman",serif;

    font-size:
        clamp(65px,10vw,135px);

    font-weight:400;

    line-height:.87;

    letter-spacing:-5px;

    text-shadow:
        0 8px 35px rgba(0,0,0,.75);
}

.title .english{
    font-style:italic;

    color:#fff;
}

/* SUBTITLE */

.subtitle{
    margin-top:32px;

    font-size:14px;

    letter-spacing:6px;

    color:rgba(255,255,255,.88);
}

/* NOTICE */

.notice{
    margin-top:34px;

    padding:16px 26px;

    border-radius:18px;

    background:
        rgba(91,39,22,.48);

    border:
        1px solid rgba(255,255,255,.14);

    backdrop-filter:blur(18px);

    box-shadow:
        0 15px 40px rgba(0,0,0,.22);

    font-size:14px;
}

.notice strong{
    display:block;
    margin-bottom:6px;
}

/* ================= BOTTOM PLAYER ================= */

.player{
    position:fixed;

    left:50%;
    bottom:25px;

    transform:translateX(-50%);

    width:min(720px,calc(100% - 30px));

    min-height:82px;

    padding:13px 20px;

    border-radius:28px;

    background:
        rgba(30,25,22,.68);

    border:
        1px solid rgba(255,255,255,.18);

    backdrop-filter:blur(25px);

    box-shadow:
        0 15px 50px rgba(0,0,0,.48);

    z-index:100;
}

.player-row{
    display:flex;
    align-items:center;

    gap:15px;
}

/* COVER */

.cover{
    width:58px;
    height:58px;

    flex-shrink:0;

    border-radius:50%;

    display:flex;
    justify-content:center;
    align-items:center;

    background:
        linear-gradient(
            135deg,
            #ff8c52,
            #7e2415
        );

    border:
        1px solid rgba(255,255,255,.25);

    box-shadow:
        0 5px 20px rgba(0,0,0,.3);

    font-size:25px;
}

/* INFO */

.song-info{
    flex:1;
    min-width:0;

    text-align:left;
}

.song-name{
    font-size:15px;
    font-weight:700;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.artist{
    font-size:12px;

    color:rgba(255,255,255,.58);

    margin-top:5px;
}

/* CONTROLS */

.controls{
    display:flex;
    align-items:center;

    gap:8px;
}

.control{
    width:40px;
    height:40px;

    border:0;

    border-radius:50%;

    background:
        rgba(255,255,255,.11);

    color:#fff;

    cursor:pointer;

    font-size:16px;

    transition:.2s;
}

.control:hover{
    background:
        rgba(255,255,255,.23);
}

.play{
    width:48px;
    height:48px;

    background:#fff;

    color:#111;

    font-size:18px;
}

/* PROGRESS */

.progress-area{
    position:absolute;

    left:22px;
    right:22px;

    bottom:7px;
}

.progress{
    width:100%;

    height:3px;

    appearance:none;

    background:
        rgba(255,255,255,.22);

    border-radius:10px;
}

.progress::-webkit-slider-thumb{
    appearance:none;

    width:9px;
    height:9px;

    background:#fff;

    border-radius:50%;

    cursor:pointer;
}

/* ================= SONGS PANEL ================= */

.songs-panel{
    position:fixed;

    top:85px;
    right:25px;

    width:290px;

    padding:18px;

    background:
        rgba(25,20,17,.82);

    border:
        1px solid rgba(255,255,255,.17);

    border-radius:20px;

    backdrop-filter:blur(25px);

    box-shadow:
        0 20px 60px rgba(0,0,0,.45);

    z-index:200;

    display:none;
}

.songs-panel.show{
    display:block;
}

.songs-panel h3{
    margin-bottom:14px;
}

.song{
    padding:12px;

    border-radius:12px;

    cursor:pointer;

    color:#eee;

    transition:.2s;
}

.song:hover{
    background:
        rgba(255,255,255,.10);
}

/* ================= VOLUME ================= */

.volume-panel{
    position:fixed;

    right:25px;
    bottom:125px;

    padding:13px 16px;

    border-radius:15px;

    background:
        rgba(20,17,15,.85);

    backdrop-filter:blur(20px);

    display:none;

    z-index:200;
}

.volume-panel.show{
    display:block;
}

.volume{
    width:110px;
}

/* ================= MOBILE ================= */

@media(max-width:700px){

    .topbar{
        top:15px;
        left:15px;
        right:15px;
    }

    .time{
        font-size:14px;
    }

    .glass-button{
        padding:9px 12px;
        font-size:12px;
    }

    .title{
        font-size:62px;
        letter-spacing:-3px;
    }

    .subtitle{
        font-size:9px;
        letter-spacing:3px;
    }

    .notice{
        font-size:12px;

        max-width:330px;
    }

    .player{
        bottom:12px;

        padding:11px 13px;

        border-radius:22px;
    }

    .cover{
        width:48px;
        height:48px;
    }

    .control{
        width:36px;
        height:36px;
    }

    .play{
        width:43px;
        height:43px;
    }

    .controls .previous{
        display:none;
    }

    .songs-panel{
        left:15px;
        right:15px;

        width:auto;
    }
}
</style>
</head>

<body>

<div class="background"></div>


<!-- TOP BAR -->

<div class="topbar">

    <div class="time" id="time">
        10:00 AM
    </div>

    <div class="top-actions">

        <button
            class="glass-button"
            onclick="toggleVolume()">
            🔊
        </button>

        <button
            class="glass-button"
            onclick="toggleSongs()">
            🎵 Songs
        </button>

        <button
            class="glass-button"
            onclick="support()">
            ❤️ Support
        </button>

    </div>

</div>


<!-- SONG PANEL -->

<div
    class="songs-panel"
    id="songsPanel">

    <h3>🎵 Bhojpuri Songs</h3>

    <div
        class="song"
        onclick="demoSong('Bhojpuri Banger')">
        ▶️ Bhojpuri Banger
    </div>

    <div
        class="song"
        onclick="demoSong('Desi Beat')">
        ▶️ Desi Beat
    </div>

    <div
        class="song"
        onclick="demoSong('Bihar Wala Swag')">
        ▶️ Bihar Wala Swag
    </div>

</div>


<!-- VOLUME -->

<div
    class="volume-panel"
    id="volumePanel">

    🔊

    <input
        class="volume"
        type="range"
        min="0"
        max="100"
        value="100">
</div>


<!-- HERO -->

<section class="hero">

    <div class="hero-content">

        <div class="online">

            <span class="online-dot"></span>

            <span id="online">
                892
            </span>

            people online

        </div>


        <h1 class="title">

            भोजपुरी<br>

            <span class="english">
                Bangers
            </span>

        </h1>


        <div class="subtitle">

            DESI VIBES • BHOJPURI MUSIC • NONSTOP

        </div>


        <div class="notice">

            <strong>
                🎧 Welcome to Bihari Bangers
            </strong>

            Sirf Bhojpuri music ka asli adda ❤️

        </div>

    </div>

</section>


<!-- PLAYER -->

<div class="player">

    <div class="player-row">

        <div class="cover">
            🎵
        </div>


        <div class="song-info">

            <div
                class="song-name"
                id="songName">

                Bhojpuri Bangers

            </div>

            <div
                class="artist">

                Bihari Bangers

            </div>

        </div>


        <div class="controls">

            <button
                class="control previous"
                onclick="previousSong()">

                ⏮

            </button>


            <button
                class="control play"
                id="playButton"
                onclick="playPause()">

                ▶

            </button>


            <button
                class="control"
                onclick="nextSong()">

                ⏭

            </button>

        </div>

    </div>


    <div class="progress-area">

        <input
            class="progress"
            type="range"
            min="0"
            max="100"
            value="0">

    </div>

</div>


<script>

/* CLOCK */

function updateTime(){

    const now = new Date();

    document.getElementById("time")
        .innerText =
        now.toLocaleTimeString([],{
            hour:"2-digit",
            minute:"2-digit"
        });

}

updateTime();

setInterval(updateTime,1000);


/* ONLINE NUMBER */

setInterval(function(){

    const number =
        850 +
        Math.floor(Math.random()*100);

    document.getElementById("online")
        .innerText = number;

},5000);


/* SONG PANEL */

function toggleSongs(){

    document
        .getElementById("songsPanel")
        .classList.toggle("show");

}


/* VOLUME */

function toggleVolume(){

    document
        .getElementById("volumePanel")
        .classList.toggle("show");

}


/* DEMO SONG */

function demoSong(name){

    document
        .getElementById("songName")
        .innerText = name;

    document
        .getElementById("songsPanel")
        .classList.remove("show");

    alert(
        "🎵 " + name +
        " selected. MP3 upload karne ke baad song chalega."
    );

}


const songs = [     {         title: "Bhojpuri Song 1",         artist: "Bihari Bangers",         file: "song1.mp3"     },     {         title: "Bhojpuri Song 2",         artist: "Bihari Bangers",         file: "song2.mp3"     } ];  let currentSong = 0;  const audio = new Audio();  const playButton =     document.getElementById("playButton");  const songName =     document.getElementById("songName");   function loadSong(index){      currentSong = index;      songName.innerText =         songs[index].title;      audio.src =         songs[index].file;  }   function playSong(){      audio.play()         .then(function(){              playButton.innerText = "⏸";          })         .catch(function(){              alert("Song play nahi ho raha. MP3 file check karo.");          });  }   function playPause(){      if(audio.paused){          playSong();      }else{          audio.pause();          playButton.innerText = "▶";      }  }   function nextSong(){      currentSong++;      if(currentSong >= songs.length){         currentSong = 0;     }      loadSong(currentSong);      playSong();  }   function previousSong(){      currentSong--;      if(currentSong < 0){         currentSong = songs.length - 1;     }      loadSong(currentSong);      playSong();  }   audio.addEventListener("ended", function(){      nextSong();  });   loadSong(0);

let playing = false;

function playPause(){

    const button =
        document.getElementById("playButton");

    if(!playing){

        playing = true;

        button.innerText = "⏸";

    }else{

        playing = false;

        button.innerText = "▶";

    }

}


function nextSong(){

    document
        .getElementById("songName")
        .innerText =
        "Next Bhojpuri Song";

}


function previousSong(){

    document
        .getElementById("songName")
        .innerText =
        "Previous Bhojpuri Song";

}


/* SUPPORT */

function support(){

    alert(
        "❤️ Bihari Bangers ko support karne ke liye dhanyawaad!"
    );

}

</script>

</body>
</html>
